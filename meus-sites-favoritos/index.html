<!DOCTYPE html>
 <html lang="pt-br">
 <head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Meus Sites Favoritos</title>
     <style>
         body {
             font-family: Arial, sans-serif;
             background-color: #f0f0f0;
             padding: 30px;
             max-width: 900px;
             margin: 0 auto;
         }
         h1 {
             text-align: center;
             color: #333;
         }
         .logos-container {
             display: flex;
             flex-wrap: wrap;
             gap: 30px;
             justify-content: center;
             padding: 30px 0;
         }
         .site {
             background-color: white;
             padding: 20px;
             border-radius: 10px;
             box-shadow: 0 2px 8px rgba(0,0,0,0.1);
             text-align: center;
             width: 140px;
         }
         .site img {
             width: 80px;
             height: auto;
             [20:56, 25/10/2026] Simone Araujo: margin-bottom: 10px;
         }
         .site h3 {
             color: #555;
             font-size: 16px;
             margin: 0;
         }
     </style>
 </head>
 <body>
     <h1>🌐 Meus Sites Favoritos</h1>
     <div class="logos-container">
         <div class="site">
             <img src="google.png" alt="Google">
             <h3>Google</h3>
         </div>
         <div class="site">
             <img src="youtube.png" alt="YouTube">
             <h3>YouTube</h3>
         </div>
         <div class="site">
             <img src="microsoft.png" alt="Microsoft">
             <h3>Microsoft</h3>
         </div>
         <div class="site">
             <img src="mercadolivre.png" alt="Mercado Livre">
             <h3>Mercado Livre</h3>
         </div>
         <div class="site">
             <img src="amazon.png" alt="Amazon">
             <h3>Amazon</h3>
         </div>
     </div>
 </body>
 </html>
